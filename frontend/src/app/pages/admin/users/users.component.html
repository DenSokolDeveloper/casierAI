<div class="users-page">
  <h2>Сотрудники</h2>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <mat-card appearance="outlined" class="entity-form-card">
    <form class="entity-form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Имя</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Пароль</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Роль</mat-label>
        <mat-select formControlName="role">
          <mat-option value="cashier">Кассир</mat-option>
          <mat-option value="owner">Владелец</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isCreating()">
          @if (isCreating()) {
            <mat-spinner diameter="18" />
          } @else {
            <mat-icon>person_add</mat-icon>
          }
          Добавить сотрудника
        </button>
      </div>
    </form>
  </mat-card>

  @if (isLoading()) {
    <div class="loading"><mat-spinner diameter="32" /></div>
  } @else if (users().length === 0) {
    <p class="empty">Пользователей пока нет.</p>
  } @else {
    <mat-card appearance="outlined" class="table-card">
      <table mat-table [dataSource]="users()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Имя</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Роль</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip-set>
              <mat-chip [class.owner-chip]="user.role === 'owner'">
                {{ user.role === 'owner' ? 'Владелец' : 'Кассир' }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let user" class="row-actions">
            <button mat-icon-button matTooltip="Удалить" (click)="remove(user)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card>
  }
</div>

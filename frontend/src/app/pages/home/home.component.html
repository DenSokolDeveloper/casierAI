<div class="home-page">
  <header>
    <h1>CasierAI</h1>
    @if (authService.currentUser(); as user) {
      <p>{{ user.name }} · {{ user.role === 'owner' ? 'Владелец' : 'Кассир' }}</p>
    }
    <button (click)="authService.logout()">Выйти</button>
  </header>

  @if (authService.currentUser()?.role === 'owner') {
    <a class="admin-link" routerLink="/admin">Открыть админку →</a>
  }

  <p class="placeholder">Экран кассы появится на следующих шагах.</p>
</div>

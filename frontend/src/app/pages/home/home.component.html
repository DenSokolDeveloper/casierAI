<div class="home-page">
  <header>
    <h1>CasierAI</h1>
    @if (authService.currentUser(); as user) {
      <p>{{ user.name }} · {{ user.role === 'owner' ? 'Владелец' : 'Кассир' }}</p>
    }
    <button (click)="authService.logout()">Выйти</button>
  </header>

  <p class="placeholder">Касса/админка появятся на следующих шагах.</p>
</div>

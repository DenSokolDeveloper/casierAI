<div class="auth-page">
  <mat-card class="auth-card">
    <div class="brand">
      <mat-icon class="brand-icon">storefront</mat-icon>
      <h1>CasierAI</h1>
      <span class="spacer"></span>
      <app-language-switcher />
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'auth.login.email' | translate }}</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" inputmode="email" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'auth.login.password' | translate }}</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() | translate }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <mat-spinner diameter="20" />
        } @else {
          {{ 'auth.login.submit' | translate }}
        }
      </button>

      <a class="switch-link" routerLink="/register">{{ 'auth.login.switchLink' | translate }}</a>
    </form>
  </mat-card>
</div>

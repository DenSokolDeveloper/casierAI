<div class="auth-page">
  <mat-card class="auth-card" appearance="outlined">
    <div class="brand">
      <mat-icon class="brand-icon">storefront</mat-icon>
      <h1>CasierAI</h1>
    </div>
    <p class="subtitle">Вход для кассира</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" inputmode="email" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Пароль</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <mat-spinner diameter="20" />
        } @else {
          Войти
        }
      </button>

      <a class="switch-link" routerLink="/register">Новый магазин? Зарегистрироваться</a>
    </form>
  </mat-card>
</div>

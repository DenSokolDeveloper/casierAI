<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>CasierAI</h1>
    <p class="subtitle">Регистрация нового магазина</p>

    <label>
      Название магазина
      <input type="text" formControlName="shopName" autocomplete="organization" />
    </label>

    <label>
      Ваше имя
      <input type="text" formControlName="name" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" inputmode="email" />
    </label>

    <label>
      Пароль
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Создаём…' : 'Зарегистрировать магазин' }}
    </button>

    <a class="switch-link" routerLink="/login">Уже есть аккаунт? Войти</a>
  </form>
</div>

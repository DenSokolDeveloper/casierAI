<div class="auth-page">
  <mat-card class="auth-card" appearance="outlined">
    <div class="brand">
      <mat-icon class="brand-icon">storefront</mat-icon>
      <h1>CasierAI</h1>
    </div>
    <p class="subtitle">Регистрация нового магазина</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Название магазина</mat-label>
        <input matInput type="text" formControlName="shopName" autocomplete="organization" />
        <mat-icon matSuffix>storefront</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ваше имя</mat-label>
        <input matInput type="text" formControlName="name" autocomplete="name" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" inputmode="email" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Пароль</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <mat-spinner diameter="20" />
        } @else {
          Зарегистрировать магазин
        }
      </button>

      <a class="switch-link" routerLink="/login">Уже есть аккаунт? Войти</a>
    </form>
  </mat-card>
</div>
